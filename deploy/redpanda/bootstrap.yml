# Redpanda cluster properties, read once when the data volume is empty. They
# cannot live on the container command line: `--set` writes cluster properties
# into redpanda.yaml, and the broker ignores cluster properties found there.
#
# retention_bytes is per partition, and MJAI_KAFKA_PARTITIONS is 1, so this is
# the topic. The size it has to hold is the historical import: 641,475 games at
# the measured p50 of 53,668 uncompressed bytes per record is about 34.4GB
# (641475 * 53668 = 34,428,254,700). 40GiB = 42,949,672,960 leaves headroom for
# the p95-heavy tail and for the overshoot below, and the real footprint will be
# well under it because the producer compresses batches with zstd. The point of
# the ceiling is that a topic which outgrows its retention drops records the API
# already answered 202 for; sizing it above the whole import means the import
# can run for days behind a stopped worker without losing one.
#
# Retention is only enforced when a segment rotates, so actual disk use
# overshoots by up to one segment (128MiB by default) per partition. Size the
# volume for that plus storage_min_free_bytes, not for the number below.
#
# Ceiling: this file is read only on a first boot against an empty volume.
# Changing retention on a running deployment is
# `rpk cluster config set retention_bytes <n>`, which the volume then keeps.
retention_bytes: 42949672960
# Never trim by age. A bulk import that takes a week must not lose its head
# because the records at the front of the topic got old while it ran.
log_retention_ms: -1
