name: Release

# A tag, and only a tag. Both triggers used to be here, so every merge built
# the same commit twice — once as `latest` off main and once as its version off
# the tag — for two identical pairs of images. Every merge gets a tag, so the
# tag is the one event that means "this is a release", and `latest` rides along
# with it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  images:
    name: Publish images
    needs:
      - checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve image tags
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            names="${GITHUB_REF_NAME#v}"
            # `latest` follows a tag as it is pushed, and only then. Re-running
            # an old tag by hand — which is how the historical versions were
            # built — rebuilds that version without dragging `latest` backwards
            # onto it.
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              names="${names} latest"
            fi
          else
            names="dev"
          fi
          api=""
          web=""
          for name in ${names}; do
            api+="ghcr.io/${owner}/majsoulmanager-api:${name},"
            web+="ghcr.io/${owner}/majsoulmanager-web:${name},"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
              api+="docker.io/${DOCKERHUB_USERNAME}/majsoulmanager-api:${name},"
              web+="docker.io/${DOCKERHUB_USERNAME}/majsoulmanager-web:${name},"
            fi
          done
          echo "api=${api%,}" >> "${GITHUB_OUTPUT}"
          echo "web=${web%,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
