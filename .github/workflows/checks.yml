name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tests/api.rs drives the real record index and idempotency store; without
    # these the SQL would only ever be checked by hand.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mjai
          POSTGRES_PASSWORD: mjai
          POSTGRES_DB: mjai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mjai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      clickhouse:
        image: clickhouse/clickhouse-server:25.3-alpine
        env:
          CLICKHOUSE_USER: mjai
          CLICKHOUSE_PASSWORD: mjai
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MJAI_POSTGRES_DSN: postgres://mjai:mjai@127.0.0.1:5432/mjai
      MJAI_CLICKHOUSE_URL: http://127.0.0.1:8123
      MJAI_CLICKHOUSE_USER: mjai
      MJAI_CLICKHOUSE_PASSWORD: mjai
      MJAI_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      MJAI_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Not service containers: neither image runs as a broker or an object
      # store on its default command, and a service container cannot override
      # one. Ingest produces to Redpanda before it answers, and the pack worker
      # uploads to RustFS before it indexes, so the suite needs both.
      - name: Start Redpanda and RustFS
        run: |
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v25.1.3 \
            redpanda start --overprovisioned --smp=1 --memory=1G --reserve-memory=0M \
            --node-id=0 --kafka-addr=external://0.0.0.0:9092 \
            --advertise-kafka-addr=external://127.0.0.1:9092
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs:latest /data
          # A broker that is up but has not elected a leader fails
          # `partition_client`, and a bucket that does not exist fails every
          # upload, so both are waited for rather than assumed.
          for _ in $(seq 60); do
            docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true' && break
            sleep 2
          done
          for _ in $(seq 60); do
            aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket \
              --bucket mjai-raw >/dev/null 2>&1 && break
            aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket \
              --bucket mjai-raw >/dev/null 2>&1 && break
            sleep 2
          done
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket mjai-raw

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build and test
        run: npm test
