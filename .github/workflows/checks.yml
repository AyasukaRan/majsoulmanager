name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tests/api.rs drives the real record index and idempotency store; without
    # these the SQL would only ever be checked by hand.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mjai
          POSTGRES_PASSWORD: mjai
          POSTGRES_DB: mjai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mjai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      clickhouse:
        image: clickhouse/clickhouse-server:25.3-alpine
        env:
          CLICKHOUSE_USER: mjai
          CLICKHOUSE_PASSWORD: mjai
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MJAI_POSTGRES_DSN: postgres://mjai:mjai@127.0.0.1:5432/mjai
      MJAI_CLICKHOUSE_URL: http://127.0.0.1:8123
      MJAI_CLICKHOUSE_USER: mjai
      MJAI_CLICKHOUSE_PASSWORD: mjai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build and test
        run: npm test
