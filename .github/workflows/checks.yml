name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No `services:` block. tests/api.rs needs four containers now, and three of
    # them — the schema mounts, the Redpanda command line, the bucket sidecar —
    # are already described in the repository's own Compose files. A service
    # container block would be a second copy of image tags, ports, credentials
    # and flags that nobody updates when Compose changes, so CI starts the same
    # stack a developer starts, through the same Makefile target.
    env:
      MJAI_POSTGRES_DSN: postgres://mjai:mjai@127.0.0.1:5432/mjai
      MJAI_CLICKHOUSE_URL: http://127.0.0.1:8123
      MJAI_CLICKHOUSE_USER: mjai
      MJAI_CLICKHOUSE_PASSWORD: mjai
      MJAI_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      MJAI_S3_ENDPOINT_URL: http://127.0.0.1:9000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The target waits for every health check and for the bucket, so nothing
      # here has to poll: a half-started broker or a missing bucket fails this
      # step rather than one arbitrary test.
      - name: Start the test infrastructure
        run: make test-infra

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build and test
        run: npm test
