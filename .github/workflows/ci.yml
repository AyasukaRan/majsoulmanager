name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  containers:
    name: Container build
    # Not `needs: checks`. This validates something else — the Dockerfiles —
    # and stacking it behind the tests only made the pull request longer.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The whole history, so the base commit this compares against is
          # present. The repository is small enough that this costs seconds.
          fetch-depth: 0

      # What this job verifies that `Checks` does not is the Dockerfiles. The
      # release build is not it: `cargo clippy --all-targets` and `cargo test`
      # already compile every line, and nothing here branches on
      # `debug_assertions`. Neither is the web build: `npm test` is
      # `npm run build && node --test`.
      #
      # So it runs when those files move, and the Dockerfiles have moved twice
      # in a hundred and twenty-five commits. Every other pull request was
      # paying five minutes to build two images and throw them away.
      - name: Decide whether the images need building
        id: touched
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # Build rather than fail if the base is not in the history after all.
          # Skipping is the answer that can be silently wrong, so it is the one
          # that has to be earned.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "build=yes" >> "${GITHUB_OUTPUT}"
            echo "读不到 base commit，照常构建。" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          changed=$(git diff --name-only "${base}" HEAD)
          if grep -qE '^(Dockerfile|web/Dockerfile|Cargo\.lock|web/package-lock\.json)$' <<< "${changed}"; then
            echo "build=yes" >> "${GITHUB_OUTPUT}"
          else
            echo "build=no" >> "${GITHUB_OUTPUT}"
            echo "镜像相关的文件没动过，跳过构建。" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Set up Docker Buildx
        if: steps.touched.outputs.build == 'yes'
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        if: steps.touched.outputs.build == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: majsoulmanager-api:ci
          cache-from: type=gha,scope=api

      - name: Build web image
        if: steps.touched.outputs.build == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: majsoulmanager-web:ci
          cache-from: type=gha,scope=web
