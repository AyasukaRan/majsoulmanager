name: mjai-management

services:
  mihomo-perms:
    image: alpine:3.21
    user: root
    volumes:
      - mihomo-data:/fix_path
    command: chown -R 10001:10001 /fix_path

  api:
    image: mjai-management-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MJAI_API_KEY: ${MJAI_API_KEY:-change-me}
      MJAI_DATA_DIR: /var/lib/mjai
      MJAI_MAX_RECORD_BYTES: ${MJAI_MAX_RECORD_BYTES:-16384}
      MJAI_MAX_BATCH_BYTES: ${MJAI_MAX_BATCH_BYTES:-536870912}
      MJAI_MAX_BATCH_RECORDS: ${MJAI_MAX_BATCH_RECORDS:-50000}
      MJAI_PACK_TARGET_BYTES: ${MJAI_PACK_TARGET_BYTES:-268435456}
      MJAI_MIHOMO_CONTROLLER_URL: http://mihomo:9090
      MJAI_MIHOMO_SECRET: ${MJAI_MIHOMO_SECRET:-change-mihomo-me}
      MJAI_MIHOMO_PROXY_URL: http://mihomo:7890
      MAJSOUL_ACCOUNTS: ${MAJSOUL_ACCOUNTS:-}
    ports: ["8000:8000"]
    volumes:
      - api-data:/var/lib/mjai
      - mihomo-data:/var/lib/mjai/mihomo
    depends_on:
      mihomo-perms:
        condition: service_completed_successfully
    restart: unless-stopped

  mihomo:
    image: metacubex/mihomo:v1.19.27
    command: ["-d", "/root/.config/mihomo", "-f", "/root/.config/mihomo/config.yaml"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - mihomo-data:/root/.config/mihomo
    restart: unless-stopped

  web:
    image: mjai-management-web:local
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      MJAI_API_BASE_URL: http://api:8000
      MJAI_API_KEY: ${MJAI_API_KEY:-change-me}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mjai
      POSTGRES_PASSWORD: mjai
      POSTGRES_DB: mjai
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjai"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    ports: ["8123:8123", "9001:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-perms:
    image: alpine:3.21
    user: root
    volumes:
      - rustfs-data:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    ports: ["9000:9000", "9002:9001"]
    volumes:
      - rustfs-data:/data

  create-bucket:
    image: amazon/aws-cli:2.27.12
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >-
      -c "until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mjai-raw 2>/dev/null;
      do aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket mjai-raw 2>/dev/null || sleep 1;
      done"

  redpanda:
    image: redpandadata/redpanda:v25.1.3
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports: ["9092:9092", "9644:9644"]
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  api-data:
  postgres-data:
  clickhouse-data:
  rustfs-data:
  redpanda-data:
  mihomo-data:
