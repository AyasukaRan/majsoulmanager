name: mjai-management

# 六份持久化数据都是 MJAI_STORAGE_ROOT 下的目录，而不是命名卷。命名卷藏在
# /var/lib/docker/volumes 里：想把语料单独放到一块大盘上得去动 daemon 的 data-root，
# 换一台机器得知道每个卷的内部路径再逐个捞。摊成一棵目录树之后，迁移就是搬这一个
# 目录。
#
# 语料那一份可以单独指到别的盘：MJAI_RUSTFS_ROOT。原来的说法是「把盘挂到它对应的
# 子目录上」，那要动 /etc/fstab —— 要 root，写错一行影响开机，而且真正的失败模式是
# 静默的：绑定挂载没生效的话 rustfs 会往 MJAI_STORAGE_ROOT 下那个空目录里写，语料
# 一半在这块盘一半在那块，而没有任何东西会报错。一个变量看得见，也不会不生效。
#
# 为什么单独拎出来的是它：它是唯一一份大小跟着语料长的。ClickHouse 和 Postgres 要
# 的是随机 I/O，该留在 SSD 上；rustfs 是大对象顺序读写，机械盘完全够。1.9 亿局按实
# 测每条两万字节压后是 3.75 TB，这个数不该由系统盘来扛。
#
# 不设它就是 MJAI_STORAGE_ROOT 下的 rustfs，也就是这个变量存在之前的行为，所以已有
# 部署什么都不用改。
#
# 默认的 ./storage 是给本地开发和 CI 的，相对路径由 Compose 按项目目录解析；部署要在
# .env 里指向一个自己管理的绝对路径。改这个值不会搬走已有数据，迁移步骤见 README。
#
# 刻意不叫 ./data：那个是 MJAI_DATA_DIR 的默认值，`cargo run` 直接跑在宿主机上时用
# 的目录。这里的子目录由 Docker 守护进程创建、属于 root，两者共用一个父目录的话，起
# 过一次 Compose 之后 `make dev` 就写不进去了。

# Docker 默认的 json-file 驱动不轮转，一个字都不删：容器活多久，那个文件就长多久。
# 这里有一条按 uuid 一局一局走一亿九千万局的补抓，几十天不停，还有采集和 ClickHouse
# 一直在写 —— 没有任何东西拦着它们把盘写满，而写满的是放语料的那块盘。
#
# 一个服务一个 GB，五份留着够回溯几天。要看更早的日志本来也不该翻 docker。
x-logs: &logs
  driver: json-file
  options:
    max-size: "200m"
    max-file: "5"

services:
  # 绑定挂载不像命名卷那样从镜像继承属主：Docker 新建的目录归 root，而 api 和 rustfs
  # 都以 uid 10001 跑，两个都不会自己修。mihomo 自己是 root 无所谓，但它那份配置是
  # api 写的，所以同样归 10001。postgres 和 clickhouse 不在这里，它们的 entrypoint
  # 以 root 起、发现属主不对会自己 chown。
  #
  # 顶层目录对了就不再往下走：rustfs 那棵树是整个语料，无条件 chown -R 会让开机成本
  # 随语料一起长，而属主只在有人拷贝数据时才会丢。
  storage-perms:
    image: alpine:3.21
    user: root
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/api:/fix/api
      - ${MJAI_STORAGE_ROOT:-./storage}/mihomo:/fix/mihomo
      - ${MJAI_RUSTFS_ROOT:-${MJAI_STORAGE_ROOT:-./storage}/rustfs}:/fix/rustfs
    entrypoint: /bin/sh
    command: >-
      -c 'for dir in /fix/api /fix/mihomo /fix/rustfs;
      do [ "$$(stat -c %u "$$dir")" = 10001 ] || chown -R 10001:10001 "$$dir"; done'

  api:
    image: ghcr.io/ayasukaran/majsoulmanager-api:${MJAI_IMAGE_TAG:-latest}
    logging: *logs
    environment:
      MJAI_API_KEY: ${MJAI_API_KEY:-change-me}
      MJAI_DATA_DIR: /var/lib/mjai
      MJAI_MAX_RECORD_BYTES: ${MJAI_MAX_RECORD_BYTES:-262144}
      MJAI_MAX_BATCH_BYTES: ${MJAI_MAX_BATCH_BYTES:-536870912}
      MJAI_MAX_BATCH_RECORDS: ${MJAI_MAX_BATCH_RECORDS:-50000}
      MJAI_PACK_TARGET_BYTES: ${MJAI_PACK_TARGET_BYTES:-268435456}
      MJAI_POSTGRES_DSN: postgres://mjai:mjai@postgres:5432/mjai
      MJAI_CLICKHOUSE_URL: http://clickhouse:8123
      MJAI_CLICKHOUSE_USER: mjai
      MJAI_CLICKHOUSE_PASSWORD: mjai
      # Addresses are pinned to the service names rather than interpolated, the
      # same as the two above: a deployment's .env names these hosts as
      # localhost, which is right from the operator's shell and wrong from
      # inside this network. Redpanda's internal listener, not the external one,
      # because the external one advertises `localhost` and a client that
      # followed that would dial itself.
      MJAI_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MJAI_S3_ENDPOINT_URL: http://rustfs:9000
      MJAI_S3_ACCESS_KEY: rustfsadmin
      MJAI_S3_SECRET_KEY: rustfsadmin
      MJAI_S3_BUCKET: mjai-raw
      MJAI_S3_REGION: us-east-1
      # Tuning knobs, passed through so that setting them in .env does
      # something. See .env.example for what each one trades.
      MJAI_KAFKA_TOPIC: ${MJAI_KAFKA_TOPIC:-mjai.records.raw}
      MJAI_KAFKA_PARTITIONS: ${MJAI_KAFKA_PARTITIONS:-8}
      MJAI_KAFKA_MAX_LAG: ${MJAI_KAFKA_MAX_LAG:-50000}
      MJAI_PACK_MAX_AGE_SECS: ${MJAI_PACK_MAX_AGE_SECS:-300}
      MJAI_PACK_IDLE_SECS: ${MJAI_PACK_IDLE_SECS:-120}
      MJAI_GC_GRACE_SECS: ${MJAI_GC_GRACE_SECS:-86400}
      MJAI_GC_INTERVAL_SECS: ${MJAI_GC_INTERVAL_SECS:-3600}
      MJAI_MIHOMO_CONTROLLER_URL: http://mihomo:9090
      MJAI_MIHOMO_SECRET: ${MJAI_MIHOMO_SECRET:-change-mihomo-me}
      MJAI_MIHOMO_PROXY_URL: http://mihomo:7890
      MJAI_MAX_NODE_MULTIPLIER: ${MJAI_MAX_NODE_MULTIPLIER:-2}
      MAJSOUL_ACCOUNTS: ${MAJSOUL_ACCOUNTS:-}
      # The re-fetch pool's own accounts. Separate from the line above
      # because it holds several and the collector only ever reads one.
      MAJSOUL_REFETCH_ACCOUNTS: ${MAJSOUL_REFETCH_ACCOUNTS:-}
      MJAI_PUBLIC_URL: ${MJAI_PUBLIC_URL:-http://localhost:3000}
      MJAI_ADMIN_EMAIL: ${MJAI_ADMIN_EMAIL:-admin@example.com}
      MJAI_ADMIN_PASSWORD: ${MJAI_ADMIN_PASSWORD:-change-this-password}
      MJAI_EMAIL_API_URL: ${MJAI_EMAIL_API_URL:-}
      MJAI_EMAIL_API_TOKEN: ${MJAI_EMAIL_API_TOKEN:-}
      MJAI_EMAIL_FROM: ${MJAI_EMAIL_FROM:-noreply@example.com}
    ports: ["${MJAI_API_PORT:-8000}:8000"]
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/api:/var/lib/mjai
      - ${MJAI_STORAGE_ROOT:-./storage}/mihomo:/var/lib/mjai/mihomo
    depends_on:
      storage-perms:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # Ingest cannot accept a record without the broker, so the API exits if it
      # cannot reach one at boot. Waiting for the health check rather than the
      # container turns the ten seconds Redpanda takes to elect a leader from a
      # crash loop into a wait.
      redpanda:
        condition: service_healthy
      # The first thing the API does after the listener is up is upload the
      # legacy packs, and every seal after that ends in a PUT, so a missing
      # bucket is not a race the API recovers from — it is every upload failing
      # until someone notices. The sidecar is bounded now, so waiting for it to
      # succeed cannot hang the stack.
      create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  mihomo:
    image: metacubex/mihomo:v1.19.27
    logging: *logs
    command: ["-d", "/root/.config/mihomo", "-f", "/root/.config/mihomo/config.yaml"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/mihomo:/root/.config/mihomo
    restart: unless-stopped

  web:
    image: ghcr.io/ayasukaran/majsoulmanager-web:${MJAI_IMAGE_TAG:-latest}
    logging: *logs
    environment:
      MJAI_API_BASE_URL: http://api:8000
      MJAI_API_KEY: ${MJAI_API_KEY:-change-me}
    ports: ["${MJAI_WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Both initdb mounts only run when the data directory is still empty, so on an
  # existing deployment they are dead weight; the API applies the same files at
  # startup, which is what actually reaches the live databases.
  postgres:
    image: postgres:17-alpine
    logging: *logs
    environment:
      POSTGRES_USER: mjai
      POSTGRES_PASSWORD: mjai
      POSTGRES_DB: mjai
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/postgres:/var/lib/postgresql/data
      - ./migrations/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    logging: *logs
    environment:
      CLICKHOUSE_USER: mjai
      CLICKHOUSE_PASSWORD: mjai
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/clickhouse:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/listen-ipv4.xml:/etc/clickhouse-server/config.d/zz-listen-ipv4.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    logging: *logs
    depends_on:
      storage-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    volumes:
      - ${MJAI_RUSTFS_ROOT:-${MJAI_STORAGE_ROOT:-./storage}/rustfs}:/data
    # Readiness rather than liveness: `/health` answers while the store is
    # still initialising, and both the bucket sidecar and every upload need a
    # store that can actually serve. The endpoints are unauthenticated on the
    # S3 port.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Bounded, because the API now waits for this to succeed: an unbounded retry
  # against a RustFS that will never serve this bucket — wrong credentials, a
  # name another tenant holds — would hang the whole stack with no error
  # anywhere, where thirty seconds of retries ends in a message and a non-zero
  # exit. Thirty is generous: rustfs is already healthy when this starts.
  create-bucket:
    image: amazon/aws-cli:2.27.12
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >-
      -c "for _ in $$(seq 30);
      do aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mjai-raw 2>/dev/null && exit 0;
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket mjai-raw 2>/dev/null && exit 0;
      sleep 1; done;
      echo 'mjai-raw bucket could not be created on http://rustfs:9000'; exit 1"

  # 和 storage-perms 同一件事，分开是因为 uid 由镜像自己定义：用它自己的镜像按名字
  # chown，就不必把一个数字抄到这里、也不会在镜像换 uid 的那天悄悄失配。无条件递归，
  # 这个目录被 retention 卡在 40GiB 上限内，遍历不了多久。
  redpanda-perms:
    image: redpandadata/redpanda:v25.1.3
    user: root
    entrypoint: chown
    command: ["-R", "redpanda:redpanda", "/var/lib/redpanda/data"]
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/redpanda:/var/lib/redpanda/data

  redpanda:
    image: redpandadata/redpanda:v25.1.3
    logging: *logs
    depends_on:
      redpanda-perms:
        condition: service_completed_successfully
    command:
      - redpanda
      - start
      # Kept: the API runs beside the broker on the same box. Without it Seastar
      # pins a thread per shard and spins it at 100%, which would take four cores
      # away from the conversions to poll an idle socket.
      - --overprovisioned
      # Redpanda gives a partition to a shard, and a shard is a core. One core is
      # the quickstart's number and it was this deployment's for a year — with a
      # single partition, which made it the right one.
      #
      # It is headroom rather than a fix, and worth saying so: the broker was
      # measured at 2.5% of one core while the pipeline ran at 290 records a
      # second, so even eight times that is a fifth of a core. What changed is
      # that there are now eight partitions and eight pack workers reading them,
      # and putting all eight on one shard makes the broker the one part of this
      # that cannot be widened without a restart.
      #
      # Raising the count is the safe direction: Redpanda rebalances partitions
      # onto the new shards at start-up. Lowering it again is the one to read the
      # release notes for.
      - --smp=${MJAI_REDPANDA_CORES:-4}
      # Two gigabytes a core, which is Redpanda's own figure. Most of it is the
      # batch cache, and this workload is the case it exists for: the pack
      # workers fetch from a few thousand offsets behind the writer, so a cache
      # that holds the backlog — 25,000 records at the ingest gate, about 375MB —
      # serves every one of those reads without touching the disk.
      - --memory=${MJAI_REDPANDA_MEMORY:-8G}
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ${MJAI_STORAGE_ROOT:-./storage}/redpanda:/var/lib/redpanda/data
    restart: unless-stopped

  # Retention is a cluster property, and cluster properties have exactly two ways
  # in: `.bootstrap.yaml`, which the broker reads only while forming a cluster
  # for the first time, and the admin API. The command line is not one of them —
  # `rpk redpanda start --set retention_bytes=...` writes into redpanda.yaml,
  # where the broker logs "Ignoring value ... use rpk cluster config edit" and
  # keeps the default.
  #
  # A bootstrap file was not enough, and this deployment is why. Its Redpanda
  # volume was created at 09:35 on 2026-07-27; the bootstrap mount was added to
  # this file at 22:20 the same evening. The cluster had already formed, so the
  # file was never read, and for the month that followed the repository said the
  # topic was capped at 40GiB and trimmed only by size while the broker was
  # actually running unlimited-by-size and seven-day-by-age — the exact opposite
  # of the intent, with nothing anywhere reporting the difference.
  #
  # So it is applied on every boot instead, the same shape as create-bucket above
  # and for the same reason: state that has to be true whatever a volume already
  # contains does not belong in a file that is read once. `cluster config set` is
  # idempotent, so this is a no-op on every boot after the first that needs it.
  #
  # retention_bytes is **per partition**, so it is divided by however many the
  # topic is being run with: the budget below is the topic's, whatever it is
  # sliced into. That division is the whole reason this is arithmetic and not a
  # literal. The literal was written when there was one partition, where the two
  # readings are the same number — raising the count to eight without it would
  # have quietly made the cap 320GiB on a volume that shares its disk with
  # PostgreSQL, ClickHouse and the staging packs, and nothing would have said so
  # until the disk filled.
  #
  # It follows MJAI_KAFKA_PARTITIONS rather than the live topic, which is the one
  # case to watch: partitions added on the broker without the variable being
  # raised leave every partition on the full budget. `Kafka::connect` logs that
  # disagreement at boot for its own reasons, and this is the other half of what
  # it costs.
  #
  # 40GiB sits above the whole historical import — 641,475 games at the measured
  # p50 of 53,668 uncompressed bytes is about 34.4GB — so an import can run for
  # days behind a stopped worker without the topic dropping records the API has
  # already answered 202 for. Real use is far under it because the producer
  # compresses batches with zstd: 150,114 collected records measured 510MB on
  # disk, and MJAI_KAFKA_MAX_LAG refuses ingest at 50,000 unpacked records —
  # about 750MB — long before retention is what stops anything. Retention is only
  # enforced when a segment rotates, so actual disk use overshoots by up to one
  # segment (128MiB) per partition; size the volume for that plus
  # storage_min_free_bytes, not for the number below.
  #
  # log_retention_ms=-1 means never trim by age. A bulk import that takes a week
  # must not lose its head because the records at the front got old while it ran.
  # The default that was silently in force here was seven days.
  #
  # Deliberately not a `depends_on` of the api. create-bucket is, because every
  # upload fails without the bucket; retention being momentarily default costs
  # nothing, and blocking ingest on this sidecar would be worse than the problem
  # it fixes. A failure shows up as a non-zero exit in `docker compose ps`.
  redpanda-config:
    image: redpandadata/redpanda:v25.1.3
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    # `key=value` rather than two arguments, because `set log_retention_ms -1`
    # has rpk read the value as a flag; its own help uses this form for exactly
    # that case. `--no-confirm` because `set` otherwise waits for a prompt that
    # a container with no terminal will never answer. Both of those fail the
    # sidecar rather than the stack, which is to say silently.
    # `$$` is Compose's escape for a literal `$`: the arithmetic is the shell's,
    # and the partition count is substituted into it by Compose first.
    command: >-
      -c "rpk -X admin.hosts=redpanda:9644 cluster config set --no-confirm retention_bytes=$$((42949672960 / ${MJAI_KAFKA_PARTITIONS:-8})) &&
      rpk -X admin.hosts=redpanda:9644 cluster config set --no-confirm log_retention_ms=-1"
