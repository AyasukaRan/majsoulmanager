name: mjai-management

services:
  mihomo-perms:
    image: alpine:3.21
    user: root
    volumes:
      - mihomo-data:/fix_path
    command: chown -R 10001:10001 /fix_path

  api:
    image: ghcr.io/ayasukaran/majsoulmanager-api:${MJAI_IMAGE_TAG:-latest}
    environment:
      MJAI_API_KEY: ${MJAI_API_KEY:-change-me}
      MJAI_DATA_DIR: /var/lib/mjai
      MJAI_MAX_RECORD_BYTES: ${MJAI_MAX_RECORD_BYTES:-262144}
      MJAI_MAX_BATCH_BYTES: ${MJAI_MAX_BATCH_BYTES:-536870912}
      MJAI_MAX_BATCH_RECORDS: ${MJAI_MAX_BATCH_RECORDS:-50000}
      MJAI_PACK_TARGET_BYTES: ${MJAI_PACK_TARGET_BYTES:-268435456}
      MJAI_POSTGRES_DSN: postgres://mjai:mjai@postgres:5432/mjai
      MJAI_CLICKHOUSE_URL: http://clickhouse:8123
      MJAI_CLICKHOUSE_USER: mjai
      MJAI_CLICKHOUSE_PASSWORD: mjai
      MJAI_MIHOMO_CONTROLLER_URL: http://mihomo:9090
      MJAI_MIHOMO_SECRET: ${MJAI_MIHOMO_SECRET:-change-mihomo-me}
      MJAI_MIHOMO_PROXY_URL: http://mihomo:7890
      MAJSOUL_ACCOUNTS: ${MAJSOUL_ACCOUNTS:-}
      MJAI_PUBLIC_URL: ${MJAI_PUBLIC_URL:-http://localhost:3000}
      MJAI_ADMIN_EMAIL: ${MJAI_ADMIN_EMAIL:-admin@example.com}
      MJAI_ADMIN_PASSWORD: ${MJAI_ADMIN_PASSWORD:-change-this-password}
      MJAI_EMAIL_API_URL: ${MJAI_EMAIL_API_URL:-}
      MJAI_EMAIL_API_TOKEN: ${MJAI_EMAIL_API_TOKEN:-}
      MJAI_EMAIL_FROM: ${MJAI_EMAIL_FROM:-noreply@example.com}
    ports: ["${MJAI_API_PORT:-8000}:8000"]
    volumes:
      - api-data:/var/lib/mjai
      - mihomo-data:/var/lib/mjai/mihomo
    depends_on:
      mihomo-perms:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  mihomo:
    image: metacubex/mihomo:v1.19.27
    command: ["-d", "/root/.config/mihomo", "-f", "/root/.config/mihomo/config.yaml"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - mihomo-data:/root/.config/mihomo
    restart: unless-stopped

  web:
    image: ghcr.io/ayasukaran/majsoulmanager-web:${MJAI_IMAGE_TAG:-latest}
    environment:
      MJAI_API_BASE_URL: http://api:8000
      MJAI_API_KEY: ${MJAI_API_KEY:-change-me}
    ports: ["${MJAI_WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Both initdb mounts only run when the data volume is first created, so on an
  # existing deployment they are dead weight; the API applies the same files at
  # startup, which is what actually reaches the live volumes.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mjai
      POSTGRES_PASSWORD: mjai
      POSTGRES_DB: mjai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_USER: mjai
      CLICKHOUSE_PASSWORD: mjai
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/listen-ipv4.xml:/etc/clickhouse-server/config.d/zz-listen-ipv4.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs-perms:
    image: alpine:3.21
    user: root
    volumes:
      - rustfs-data:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    volumes:
      - rustfs-data:/data

  create-bucket:
    image: amazon/aws-cli:2.27.12
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >-
      -c "until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mjai-raw 2>/dev/null;
      do aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket mjai-raw 2>/dev/null || sleep 1;
      done"

  redpanda:
    image: redpandadata/redpanda:v25.1.3
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  api-data:
  postgres-data:
  clickhouse-data:
  rustfs-data:
  redpanda-data:
  mihomo-data:
