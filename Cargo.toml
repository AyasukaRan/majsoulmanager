[package]
name = "mjai-management"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scalable ingestion, indexing and export service for mjai logs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
indicatif = { version = "0.17", features = ["rayon"] }
parking_lot = "0.12"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
# Pure Rust, so the runtime image needs neither cmake nor librdkafka. The
# feature is `compression-zstd`, not `zstd`: the latter is the implicit
# optional-dependency feature, which compiles the codec in but leaves
# `Compression::Zstd` behind a `cfg`. `default-features = false` is what drops
# gzip, lz4 and snappy, none of which anything writes into this topic.
rskafka = { version = "0.6", default-features = false, features = ["compression-zstd"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "2"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time", "process", "sync", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Already in the tree under tower-http; the "io" feature is what turns a
# finished export file into a response body without reading it into memory.
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

# One call at startup, to raise `RLIMIT_NOFILE` to what the OS already allows.
# Every Go binary in this stack does that for itself, which is why mihomo sits
# at the hard limit and this process was still on Docker's soft 1024. Already in
# the tree under tokio, so it costs nothing to build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Line tables instead of full DWARF. What a panic here has ever needed is the
# file and line it came from, and that is exactly what this keeps; what it drops
# is the variable-level information a debugger would show, which nothing in this
# repository's workflow reads — there is no lldb step, the loop is a test and a
# backtrace.
#
# Measured, both from `cargo clean` through `cargo test --all-targets --no-run`:
# 1.7G and 48.7s wall (200.9s CPU) with full debug, 1.2G and 30.6s (126.5s)
# with this. The time is the bigger half of it — a third off every cold build
# and off CI, for debug sections nothing here opens.
#
# It is not what made `target` reach 14G, and the note is worth leaving: that
# was accumulation, not one build. Cargo never reclaims an old artifact, so
# `deps/` held ten hashed copies of this crate across 107,754 files. Only
# `cargo clean` answers that; this makes each copy smaller.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
